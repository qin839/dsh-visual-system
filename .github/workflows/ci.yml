# CI：跑测试。本项目零运行时依赖，所以这里连 install 都不需要。
#
# 为什么不是 Deno：这是一个以 Node/ESM 发布到 npm 的 DSH 插件，
# 而且测试用的是 node:test 内置测试器。原来的 deno.yml 既跑不了这些测试，
# 也会因为仓库里没有 Deno 测试而每次 push 都失败。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 没有依赖要装：测试只用了 node:test / node:assert
      - name: Run tests
        run: npm test
